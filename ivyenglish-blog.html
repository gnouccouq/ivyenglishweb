<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="SIO0aKLY9cZk8-k09UBuQ6r3zaNIMu_pswgELE3FVWw" />
    <title>ivyEnglish - Blog & Chia Sẻ Kiến Thức</title>
    <meta name="description" content="Chia sẻ kiến thức học tiếng Anh, tài liệu độc quyền và tin tức giáo dục mới nhất từ ivyEnglish.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="canonical" href="https://ivyenglish.io.vn/ivyenglish-blog.html" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="https://ivyenglish.io.vn/images/favicon.png" sizes="any">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root { --p-blue: #1a237e; --s-gold: #c5a059; --accent: #5b8cff; }
        
        /* Cấu trúc trang chủ */
        .home-content.hidden { display: none !important; }
        
        .search-container { max-width: 600px; margin: -30px auto 40px; position: relative; z-index: 10; padding: 0 20px; }
        .search-wrapper { display: flex; background: white; border-radius: 50px; padding: 8px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid #eee; }
        .search-wrapper input { border: none; outline: none; flex: 1; padding: 10px; font-size: 1rem; color: #334155; }
        .search-wrapper i { display: flex; align-items: center; color: var(--accent); font-size: 1.2rem; }

        .blog-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; margin-bottom: 30px; }
        @media (max-width: 992px) { .blog-group { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .blog-group { grid-template-columns: 1fr; } }

        .blog-hero { background: linear-gradient(135deg, var(--p-blue) 0%, #2a3eb1 100%); padding: 120px 20px 80px; text-align: center; color: white; clip-path: ellipse(150% 100% at 50% 0%); }
        .blog-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); transition: 0.3s; display: flex; flex-direction: column; border: 1px solid rgba(0,0,0,0.03); }
        .blog-card:hover { transform: translateY(-10px); }
        .blog-card img { width: 100%; height: 220px; object-fit: cover; }
        .blog-card-body { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        .blog-category { background: rgba(91, 140, 255, 0.1); color: var(--accent); padding: 4px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 700; width: fit-content; margin-bottom: 12px; text-transform: uppercase; }
        .blog-title { font-size: 1.15rem; font-weight: 700; color: var(--p-blue); line-height: 1.4; margin-bottom: 10px; }
        .btn-readmore { margin-top: auto; color: var(--accent); font-weight: 700; text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 8px; }

        /* Cấu trúc trang chi tiết bài viết */
        #post-detail-view { display: none; max-width: 900px; margin: 40px auto; padding: 0 20px; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .back-btn { cursor: pointer; color: var(--accent); font-weight: 700; margin-bottom: 30px; display: inline-flex; align-items: center; gap: 10px; transition: 0.2s; }
        .back-btn:hover { color: var(--p-blue); }
        .post-full-content img { max-width: 100%; border-radius: 12px; margin: 20px 0; }

        .cta-box { background: #f0f7ff; padding: 30px; border-radius: 15px; border-left: 5px solid var(--accent); margin-top: 50px; text-align: center; }
        .category-divider { margin: 40px 0 20px; display: flex; align-items: center; gap: 15px; }
        .category-divider h2 { color: var(--p-blue); font-size: 1.5rem; white-space: nowrap; }
        .category-divider .line { height: 2px; background: #eee; flex: 1; }

        /* Skeleton Loading */
        .skeleton { background: #eee; background: linear-gradient(110deg, #ececec 8%, #f5f5f5 18%, #ececec 33%); border-radius: 12px; background-size: 200% 100%; animation: 1.5s shine linear infinite; }
        .skeleton-img { height: 220px; width: 100%; }
        .skeleton-text { height: 20px; margin-bottom: 10px; width: 80%; }
        @keyframes shine { to { background-position-x: -200%; } }
        /* Bố cục chia cột cho Blog */
        .blog-layout {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .blog-main {
            flex: 3; /* Chiếm 75% chiều rộng */
            min-width: 0; /* Tránh lỗi tràn layout */
        }

        .blog-sidebar {
            flex: 1; /* Chiếm 25% chiều rộng */
            position: sticky;
            top: 100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (max-width: 992px) {
            .blog-layout { flex-direction: column; }
            .blog-sidebar { width: 100%; position: static; }
        }

        /* Style cho widget xem nhiều */
        .sidebar-widget {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }

        .widget-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--p-blue);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent);
        }

        .popular-item {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .popular-item:hover .popular-title { color: var(--accent); }

        .popular-img {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .popular-info { flex: 1; }

        .popular-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #333;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .popular-meta {
            font-size: 0.75rem;
            color: #888;
            margin-top: 4px;
        }
        .btn-test {
            display:inline-block; 
            margin-top:10px; 
            background:var(--accent); 
            color:white; 
            padding:12px 25px; 
            border-radius:50px; 
            text-decoration:none; 
            font-weight:bold;
            transition: 0.3s;
        }
        .btn-test:hover {
            background: var(--p-blue);
            transform: scale(1.05);
        }

        /* Đảm bảo bài viết chi tiết không bị quá hẹp trên mobile */
        #post-detail-view {
            max-width: 100%;
            margin: 0;
            padding: 0;
        }

        /* TAB FILTER CSS */
        .filter-tabs-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .filter-tab {
            padding: 10px 25px;
            border: 1px solid #e2e8f0;
            border-radius: 50px;
            background: white;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .filter-tab:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }
        .filter-tab.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(91, 140, 255, 0.4);
        }
        @media (max-width: 600px) {
            .filter-tabs-container {
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 10px;
                white-space: nowrap;
                flex-wrap: nowrap;
            }
            .filter-tab {
                flex: 0 0 auto;
            }
        }
    </style>
</head>
<body>
    <div id="preloader">
        <div class="loader-content">
            <div class="logo-wrapper">
                <img src="images/logo.png" alt="Logo" class="loader-logo">
                <div class="spinner"></div>
            </div>
        </div>
    </div>
    
    <div id="header-placeholder"></div>

    <div class="blog-hero">
    <div class="container" data-aos="zoom-in">
        <h1>Blog ivyEnglish</h1>
        <p>Kiến thức hữu ích, tài liệu độc quyền và tin tức giáo dục mới nhất.</p>
    </div>
</div>

<div class="search-container" data-aos="fade-up">
    <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="blogSearch" placeholder="Tìm bài viết (IELTS, từ vựng...)" onkeyup="handleSearch()">
    </div>
</div>

<div style="text-align: center;" data-aos="fade-up">
    <div class="filter-tabs-container" id="category-filter-list">
        <!-- JS will populate this -->
    </div>
</div>

<section class="blog-section" style="padding: 0 20px 80px; max-width: 1200px; margin: auto;">
    <div class="blog-layout">
        <div class="blog-main">
            <div id="blog-container" class="home-content">
                <div class="blog-group">
                    <div class="blog-card"><div class="skeleton skeleton-img"></div><div class="blog-card-body"><div class="skeleton skeleton-text"></div></div></div>
                </div>
            </div>

            <main id="post-detail-view" style="display:none;">
                <div class="back-btn" onclick="closePost()">
                    <i class="fas fa-arrow-left"></i> Quay lại Blog
                </div>
                <article id="detail-content"></article>
                <div class="cta-box">
                    <h4>Bạn thấy kiến thức này hữu ích?</h4>
                    <p>Nhận ngay lộ trình học tiếng Anh cá nhân hóa miễn phí.</p>
                    <a href="ivyenglish-level-test.html" class="btn-test">Đăng ký Test trình độ ngay</a>
                </div>
                <div id="recommended-posts-container" style="margin-top: 40px;"></div>
            </main>
        </div>

        <aside class="blog-sidebar">
            <div class="sidebar-widget">
                <h3 class="widget-title">Xem nhiều nhất</h3>
                <div id="popular-container"></div>
            </div>
        </aside>
    </div>
</section>

    <div id="footer-placeholder"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Toàn bộ script cũ đã được xóa và thay thế bằng module script bên dưới
    </script>
    <script src="js/menu-scrolltop.js"></script>
    <script src="js/daily-word.js"></script>
    <script type="module">
        import { db, collection, getDocs, query, orderBy, doc, getDoc, updateDoc } from './js/firebase-config.js';
        import './js/auth-handler.js'; // Chạy auth handler để xử lý đăng nhập

        let allPosts = [];
        const ORIGIN_TITLE = document.title;

        function createSlug(str) {
            if (!str) return "";
            str = str.toLowerCase();
            str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
            str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
            str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
            str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
            str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
            str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
            str = str.replace(/đ/g, "d");
            str = str.replace(/[^a-z0-9 ]/g, "");
            str = str.replace(/\s+/g, "-");
            str = str.replace(/-+/g, "-");
            return str.trim();
        }

        async function initBlog() {
            try {
                const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                allPosts = [];
                querySnapshot.forEach(doc => {
                    let post = doc.data();
                    post.id = doc.id; // Firestore document ID
                    allPosts.push(post);
                });

                renderUI(allPosts);
                populateFilter();
                handleUrlParameters();

            } catch (e) {
                console.error("Lỗi tải bài viết từ Firestore:", e);
                document.getElementById('blog-container').innerHTML = `<p style="text-align:center; color:red;">Không thể tải bài viết lúc này.</p>`;
            }
        }

        function handleUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const category = urlParams.get('category');
            const slugId = urlParams.get('id');

            if (slugId && allPosts.length > 0) {
                const post = allPosts.find(p => p.slug === slugId);
                if (post) {
                    setTimeout(() => viewPost(post.id), 100);
                }
            } else if (category && allPosts.length > 0) {
                const buttons = document.querySelectorAll('.filter-tab');
                const targetButton = Array.from(buttons).find(btn => btn.innerText.trim() === category.trim());
                if (targetButton) {
                    filterByCategory(category, targetButton);
                }
            }
        }

        function renderUI(data) {
            const container = document.getElementById('blog-container');
            if (!data || data.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 60px 20px;"><p style="font-size: 1.2rem; color: #666;">Không có bài viết nào trong danh mục này.</p></div>`;
                return;
            }

            const categories = [...new Set(data.map(post => post.category))];
            let html = '';
            categories.forEach(cat => {
                const postsInCategory = data.filter(post => post.category === cat);
                html += `
                    <div class="category-divider" data-aos="fade-right">
                        <h2>${cat || 'Chưa phân loại'}</h2>
                        <div class="line"></div>
                    </div>
                    <div class="blog-group">
                        ${renderCards(postsInCategory)}
                    </div>
                `;
            });
            
            container.innerHTML = html;
            if (allPosts.length > 0) renderPopular(allPosts);
            setTimeout(() => { AOS.refresh(); }, 100);
        }

        function renderPopular(posts) {
            const popularContainer = document.getElementById('popular-container');
            const popularPosts = [...posts].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 5);

            popularContainer.innerHTML = popularPosts.map(post => `
                <div class="popular-item" onclick="viewPost('${post.id}')">
                    <img src="${post.image}" class="popular-img">
                    <div class="popular-info">
                        <div class="popular-title">${post.title}</div>
                        <div class="popular-meta">🔥 ${post.views || 0} lượt xem</div>
                    </div>
                </div>
            `).join('');
        }

        function renderCards(posts, animation = true) {
            return posts.map(post => `
                <div class="blog-card" ${animation ? 'data-aos="zoom-in"' : ''}>
                    <img src="${post.image}" alt="${post.title}" loading="lazy">
                    <div class="blog-card-body">
                        <span class="blog-category">${post.category}</span>
                        <h3 class="blog-title">${post.title}</h3>
                        <div class="popular-meta">📅 ${new Date(post.timestamp?.toDate()).toLocaleDateString('vi-VN')}</div>
                        <a onclick="viewPost('${post.id}')" class="btn-readmore">Đọc thêm <i class="fas fa-arrow-right"></i></a>
                    </div>
                </div>
            `).join('');
        }

        function renderRecommended(currentPost) {
            const container = document.getElementById('recommended-posts-container');
            if (!container) return;

            // 1. Lọc các bài cùng danh mục (trừ bài hiện tại) - Xử lý an toàn nếu category null
            let related = allPosts.filter(p => (p.category || "") === (currentPost.category || "") && p.id !== currentPost.id);
            
            // 2. Nếu ít hơn 3 bài, lấy thêm các bài mới nhất từ danh mục khác để lấp đầy
            if (related.length < 3) {
                const others = allPosts.filter(p => (p.category || "") !== (currentPost.category || "") && p.id !== currentPost.id);
                // Gộp mảng và lấy 3 bài đầu tiên
                related = related.concat(others).slice(0, 3);
            } else {
                // Nếu có nhiều bài cùng danh mục, lấy 3 bài (có thể random hoặc lấy mới nhất)
                related = related.slice(0, 3);
            }

            if (related.length > 0) {
                // Gọi renderCards với tham số false để tắt hiệu ứng AOS -> Hiển thị ngay lập tức
                container.innerHTML = `<div class="category-divider"><h2>Bài viết đề xuất cho bạn</h2><div class="line"></div></div><div class="blog-group" style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));">${renderCards(related, false)}</div>`;
            } else {
                container.innerHTML = '';
            }
        }

        window.viewPost = async function(postId) {
            const post = allPosts.find(p => p.id === postId);
            if (!post) return;
            
            const newViews = (post.views || 0) + 1;
            post.views = newViews;
            renderPopular(allPosts);

            const slug = post.slug || createSlug(post.title);
            const postUrl = "?id=" + slug;
            window.history.pushState({ postId: postId }, post.title, postUrl);
            document.title = post.title;

            document.getElementById('detail-content').innerHTML = `
                <span class="blog-category">${post.category}</span>
                <h1 style="color:var(--p-blue); margin:15px 0;">${post.title}</h1>
                <p style="color:#888;">📅 ${new Date(post.timestamp?.toDate()).toLocaleDateString('vi-VN')} | 🔥 ${post.views} lượt xem</p>
                <div class="post-full-content">${post.content}</div>
            `;
            document.getElementById('blog-container').classList.add('hidden');
            document.getElementById('post-detail-view').style.display = 'block';

            // Update view count in Firestore
            const postRef = doc(db, "posts", postId);
            await updateDoc(postRef, { views: newViews }).catch(err => console.warn("Lỗi update view:", err));

            // Render Recommended Posts
            renderRecommended(post);

            window.scrollTo(0, 0);
        };

        window.closePost = function() {
            document.title = ORIGIN_TITLE;
            window.history.pushState({type: 'home'}, '', window.location.pathname);
            document.getElementById('blog-container').classList.remove('hidden');
            document.getElementById('post-detail-view').style.display = 'none';
            window.scrollTo(0, 0);
            AOS.refresh();
        };

        window.handleSearch = function() {
            const searchInput = document.getElementById('blogSearch');
            const container = document.getElementById('blog-container');
            const query = searchInput.value.toLowerCase().trim();
            
            document.querySelectorAll('.filter-tab').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.filter-tab:first-child')?.classList.add('active');

            if (!query) {
                renderUI(allPosts);
                return;
            }
            
            const filtered = allPosts.filter(post => 
                (post.title && post.title.toLowerCase().includes(query)) ||
                (post.category && post.category.toLowerCase().includes(query))
            );
            
            if (filtered.length > 0) {
                container.innerHTML = `<div class="category-divider"><h2>Kết quả cho: "${searchInput.value}"</h2><div class="line"></div></div><div class="blog-group">${renderCards(filtered)}</div>`;
            } else {
                container.innerHTML = `<div style="text-align:center; padding: 60px 20px;"><p>Không tìm thấy bài viết phù hợp với "<strong>${searchInput.value}</strong>"</p></div>`;
            }
            AOS.refresh();
        }

        function populateFilter() {
            const categories = [...new Set(allPosts.map(post => post.category).filter(Boolean))];
            const filterList = document.getElementById('category-filter-list');
            if (!filterList) return;

            let listHtml = `<button class="filter-tab active" onclick="filterByCategory('all', this)">Tất cả</button>`;
            categories.forEach(cat => {
                listHtml += `<button class="filter-tab" onclick="filterByCategory('${cat}', this)">${cat}</button>`;
            });
            filterList.innerHTML = listHtml;
        }

        window.filterByCategory = function(category, btnElement) {
            if (btnElement) {
                document.querySelectorAll('.filter-tab').forEach(btn => btn.classList.remove('active'));
                btnElement.classList.add('active');
            }
            document.getElementById('blogSearch').value = '';
            const filteredPosts = category === 'all' ? allPosts : allPosts.filter(post => post.category === category);
            renderUI(filteredPosts);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            // Sử dụng hàm includeHTML chung từ js/menu-scrolltop.js
            if(window.includeHTML) await window.includeHTML();
            
            initBlog();
            AOS.init({ duration: 800, once: true });
        });
    </script>
</body>
</html>
