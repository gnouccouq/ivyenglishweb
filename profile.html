<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang cá nhân - ivyEnglish</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="https://ivyenglish.io.vn/images/favicon.png" sizes="any">
    <style>
        :root { --profile-bg: #f4f7fa; --p-blue: #1a237e; --accent: #5b8cff; }
        body { background: var(--profile-bg); margin: 0; padding: 0; font-family: 'Roboto', sans-serif; color: #334155; }
        .profile-wrapper { max-width: 1000px; margin: 0 auto; padding: 120px 20px 60px; }
        .profile-card { background: #ffffff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; display: grid; grid-template-columns: 320px 1fr; min-height: 600px; }
        .profile-sidebar { background: linear-gradient(180deg, var(--p-blue) 0%, #303f9f 100%); padding: 50px 30px; color: white; text-align: center; }
        .profile-avatar-wrapper { position: relative; width: 140px; height: 140px; margin: 0 auto 25px; }
        .profile-avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; border: 4px solid rgba(255,255,255,0.2); object-fit: cover; background: #e2e8f0; }
        .avatar-edit-icon { position: absolute; bottom: 5px; right: 5px; background: #fff; color: var(--p-blue); width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.3s; }
        .avatar-edit-icon:hover { background: var(--accent); color: white; }
        .profile-main { padding: 50px; background: white; }
        .section-title { font-family: 'Montserrat', sans-serif; color: var(--p-blue); font-size: 1.1rem; font-weight: 700; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .info-group label { display: block; font-size: 0.75rem; font-weight: 700; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }
        .info-group input, .info-group select { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1.5px solid #e2e8f0; background: #f8fafc; font-size: 0.95rem; box-sizing: border-box; }
        .btn-update { margin-top: 30px; padding: 14px 30px; background: var(--p-blue); color: white; border: none; border-radius: 10px; font-family: 'Montserrat', sans-serif; font-weight: 700; cursor: pointer; transition: 0.3s; width: 100%; }
        .btn-update:hover { background: var(--accent); transform: translateY(-2px); }
        @media (max-width: 850px) { 
            .profile-card { grid-template-columns: 1fr; } 
        }
        @media (max-width: 600px) {
            .profile-wrapper { padding: 100px 15px 40px; }
            .profile-main { padding: 30px 20px; }
            .info-grid { grid-template-columns: 1fr; gap: 15px; }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    

    <div class="profile-wrapper">
        <div class="profile-card" data-aos="fade-up">
            <div class="profile-sidebar">
                <div class="profile-avatar-wrapper">
                    <img id="display-avatar" src="images/avatar-profile.png" alt="User">
                    <div class="avatar-edit-icon" onclick="document.getElementById('avatar-input').click()">
                        <i class="fas fa-camera"></i>
                    </div>
                    <input type="file" id="avatar-input" style="display: none;" accept="image/*">
                </div>
                <h3 id="display-name">Học viên</h3>
                <p id="display-email">đang tải...</p>
                
                <div style="margin-top: 30px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);">
                    <small style="text-transform: uppercase; font-size: 0.65rem; letter-spacing: 1px;">Hạng thành viên</small>
                    <div style="font-weight: 800; color: #ffd700; margin-top: 5px; font-size: 1rem;">
                        <i class="fas fa-crown"></i> STANDARD
                    </div>
                </div>
            </div>

            <div class="profile-main">
                <div class="section-title">THÔNG TIN CÁ NHÂN</div>
                <form id="profile-form">
                    <div class="info-grid">
                        <div class="info-group">
                            <label>Họ và Tên</label>
                            <input type="text" id="input-name" placeholder="Tên hiển thị">
                        </div>
                        <div class="info-group">
                            <label>Số điện thoại</label>
                            <input type="text" id="input-phone" placeholder="Số điện thoại">
                        </div>
                        <div class="info-group">
                            <label>Giới tính</label>
                            <select id="input-gender">
                                <option value="">Chọn giới tính</option>
                                <option value="Nam">Nam</option>
                                <option value="Nữ">Nữ</option>
                                <option value="Khác">Khác</option>
                            </select>
                        </div>
                        <div class="info-group">
                            <label>Email</label>
                            <input type="email" id="input-email" disabled>
                        </div>
                        <div class="info-group">
                            <label>Ngày sinh</label>
                            <input type="date" id="input-dob">
                        </div>
                    </div>

                    <div class="section-title" style="margin-top: 30px;">BẢO MẬT</div>
                    <div class="info-group">
                        <label>Mật khẩu</label>
                        <div style="position: relative;">
                            <input type="password" value="********" disabled>
                            <small id="change-pass-btn" style="color: var(--accent); cursor: pointer; position: absolute; right: 15px; top: 12px; font-weight: 700;">ĐỔI MẬT KHẨU</small>
                        </div>
                    </div>

                    <button type="submit" class="btn-update" id="submit-btn">
                        <i class="fas fa-check-circle"></i> CẬP NHẬT THÔNG TIN
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <!-- Custom Popup -->
    <div id="custom-popup" class="popup-overlay">
        <div class="popup-content">
            <span id="popup-icon" class="popup-icon"></span>
            <h3 id="popup-title"></h3>
            <p id="popup-message"></p>
            <button id="popup-close-btn" class="btn-close-popup">Đóng</button>
        </div>
    </div>

    <div class="floating-contact">
        <a href="#" class="float-btn scroll-to-top" title="Lên đầu trang">
            <i class="fas fa-arrow-up"></i>
        </a>
        <a href="tel:0969730433" class="float-btn hotline" title="Hotline">
            <i class="fas fa-phone-alt"></i>
        </a>
        <a href="https://zalo.me/0969730433" target="_blank" class="float-btn zalo" title="Chat Zalo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Icon_of_Zalo.svg" alt="Zalo">
        </a>
        <a href="https://www.facebook.com/profile.php?id=61576482823082" target="_blank" class="float-btn facebook-messenger" title="Nhắn tin Messenger">
            <i class="fab fa-facebook-messenger"></i>
        </a>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script type="module">
        import { auth, onAuthStateChanged, updateProfile, sendPasswordResetEmail, db, doc, getDoc, setDoc } from './js/firebase-config.js';
        
        const IMGUR_CLIENT_ID = 'd70305e7c3ac5c6';

        window.tempAvatarUrl = null;

        // --- POPUP LOGIC ---
        function showPopup(type, title, message) {
            const popup = document.getElementById('custom-popup');
            const iconEl = document.getElementById('popup-icon');
            const titleEl = document.getElementById('popup-title');
            const messageEl = document.getElementById('popup-message');

            if (!popup || !iconEl || !titleEl || !messageEl) return;

            titleEl.innerText = title;
            messageEl.innerHTML = message;

            let iconClass = 'fas fa-info-circle';
            let iconColor = '#3498db';
            if (type === 'success') {
                iconClass = 'fas fa-check-circle';
                iconColor = '#2ECC71';
            } else if (type === 'error') {
                iconClass = 'fas fa-times-circle';
                iconColor = '#e74c3c';
            }
            iconEl.innerHTML = `<i class="${iconClass}"></i>`;
            iconEl.style.color = iconColor;
            
            popup.style.display = 'flex';
        }

        function closePopup() {
            const popup = document.getElementById('custom-popup');
            if (popup) popup.style.display = 'none';
        }
        document.getElementById('popup-close-btn').addEventListener('click', closePopup);
        document.getElementById('custom-popup').addEventListener('click', (e) => { if(e.target.id === 'custom-popup') closePopup(); });
        // --- END POPUP LOGIC ---

        // 1. UPLOAD ẢNH LÊN IMGUR
        document.getElementById('avatar-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const avatarImg = document.getElementById('display-avatar');
            const originalSrc = avatarImg.src;
            avatarImg.style.opacity = "0.4";

            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('https://api.imgur.com/3/image', {
                    method: 'POST',
                    headers: { Authorization: `Client-ID ${IMGUR_CLIENT_ID}` },
                    body: formData
                });

                const result = await response.json();
                if (result.success) {
                    window.tempAvatarUrl = result.data.link;
                    avatarImg.src = window.tempAvatarUrl;
                    showPopup('success', 'Thành công', 'Ảnh đại diện đã được tải lên. Nhấn "Cập nhật" để lưu thay đổi.');
                } else {
                    showPopup('error', 'Lỗi Imgur', 'Không thể tải ảnh lên lúc này. Vui lòng thử lại sau.');
                    avatarImg.src = originalSrc;
                }
            } catch (err) {
                showPopup('error', 'Lỗi kết nối', 'Không thể kết nối đến máy chủ Imgur.');
                avatarImg.src = originalSrc;
            } finally {
                avatarImg.style.opacity = "1";
            }
        });

        // 2. LOAD DATA
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('display-email').innerText = user.email;
                document.getElementById('input-email').value = user.email;

                try {
                    if (user.photoURL) document.getElementById('display-avatar').src = user.photoURL;
                    
                    // Mặc định lấy tên từ Google nếu có (hiển thị trước khi load Sheet để không bị trống)
                    if(user.displayName) {
                        document.getElementById('display-name').innerText = user.displayName;
                        document.getElementById('input-name').value = user.displayName;
                    }

                    const docRef = doc(db, "users", user.uid);
                    const docSnap = await getDoc(docRef);
                    
                    if (docSnap.exists()) {
                        const row = docSnap.data();
                        if (row["Họ Tên"]) {
                            document.getElementById('display-name').innerText = row["Họ Tên"];
                            document.getElementById('input-name').value = row["Họ Tên"];
                            
                            // Cập nhật luôn tên trên header nếu đang ở trang Profile
                            const headerName = document.getElementById('nav-user-name');
                            if (headerName) headerName.innerText = row["Họ Tên"];
                            localStorage.setItem('ivy_user_name', row["Họ Tên"]); // Lưu tên vào bộ nhớ trình duyệt
                        }
                        document.getElementById('input-phone').value = row["Số Điện Thoại"] || "";
                        document.getElementById('input-dob').value = row["Ngày Sinh"] || "";
                        document.getElementById('input-gender').value = row["Giới Tính"] || "";
                        if (row["Avatar"]) document.getElementById('display-avatar').src = row["Avatar"];
                    }
                } catch (err) { console.error("Lỗi load data:", err); }
            } else {
                window.location.href = 'login.html';
            }
        });

        // 3. SAVE DATA
        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return;

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "ĐANG LƯU...";

            const payload = {
                "ID": user.uid,
                "Họ Tên": document.getElementById('input-name').value.trim(),
                "Email": user.email,
                "Số Điện Thoại": document.getElementById('input-phone').value.trim(),
                "Giới Tính": document.getElementById('input-gender').value,
                "Ngày Sinh": document.getElementById('input-dob').value,
                "Avatar": window.tempAvatarUrl || document.getElementById('display-avatar').src,
                "Thời Gian": new Date().toLocaleString('vi-VN')
            };

            try {
                await setDoc(doc(db, "users", user.uid), payload, { merge: true });

                showPopup('success', 'Thành công', 'Thông tin cá nhân của bạn đã được cập nhật.');
                document.getElementById('display-name').innerText = payload["Họ Tên"];
                
                // Cập nhật tên trên Header ngay lập tức
                const headerName = document.getElementById('nav-user-name');
                if(headerName) headerName.innerText = payload["Họ Tên"];
                localStorage.setItem('ivy_user_name', payload["Họ Tên"]); // Lưu tên mới vào bộ nhớ trình duyệt

                // Cập nhật tên vào Firebase Profile để đồng bộ cho các lần đăng nhập sau
                updateProfile(user, { displayName: payload["Họ Tên"] }).catch(console.error);
            } catch (err) { 
                showPopup('error', 'Lỗi hệ thống', 'Không thể lưu thông tin. Vui lòng thử lại sau.');
            }
            finally {
                btn.disabled = false;
                btn.innerText = "CẬP NHẬT NGAY";
            }
        });

        // 4. ĐỔI MẬT KHẨU
        document.getElementById('change-pass-btn').addEventListener('click', async () => {
            const user = auth.currentUser;
            if (user && user.email) {
                if (confirm(`Bạn có muốn gửi email đặt lại mật khẩu tới ${user.email} không?`)) {
                    try {
                        await sendPasswordResetEmail(auth, user.email);
                        showPopup('success', 'Đã gửi Email', 'Một email hướng dẫn đã được gửi tới hòm thư của bạn. Vui lòng kiểm tra và làm theo hướng dẫn.');
                    } catch (error) {
                        showPopup('error', 'Lỗi', 'Không thể gửi email đặt lại mật khẩu lúc này. Vui lòng thử lại sau.');
                    }
                }
            }
        });

        async function includeHTML() {
            const comps = [{ id: 'header-placeholder', file: 'header.html' }, { id: 'footer-placeholder', file: 'footer.html' }];
            for (const c of comps) {
                const el = document.getElementById(c.id);
                if (el) {
                    const res = await fetch(c.file);
                    if (res.ok) el.innerHTML = await res.text();
                }
            }
            if (window.AOS) AOS.init({ duration: 800, once: true });
        }
        includeHTML();
    </script>
    <script type="module" src="./js/auth-handler.js"></script>
    <script type="module" src="./js/firebase-config.js"></script>
    <script src="js/menu-scrolltop.js"></script>
    <script src="js/daily-word.js"></script>
</body>
</html>
