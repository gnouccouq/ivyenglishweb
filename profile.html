<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang cá nhân - ivyEnglish</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="https://ivyenglish.io.vn/images/favicon.png" sizes="any">
    <style>
        :root { --profile-bg: #f4f7fa; --p-blue: #1a237e; --accent: #5b8cff; }
        body { background: var(--profile-bg); margin: 0; padding: 0; font-family: 'Roboto', sans-serif; color: #334155; }
        .profile-wrapper { max-width: 1000px; margin: 0 auto; padding: 120px 20px 60px; }
        
        .profile-card { 
            display: grid; 
            grid-template-columns: 220px 1fr; /* Cột menu và cột nội dung */
            gap: 25px; 
            align-items: start;
        }
        
        .profile-nav-col { 
            background: white; 
            border-radius: 20px; 
            padding: 20px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.05); 
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .profile-right-panel {
            display: flex;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            min-height: 650px; /* Cố định chiều cao tối thiểu */
            min-width: max-content; /* Cố định chiều rộng tối thiểu */
            overflow: hidden;
        }

        .profile-sidebar { 
            background: linear-gradient(180deg, var(--p-blue) 0%, #303f9f 100%); 
            padding: 40px 25px; 
            color: white; 
            text-align: center; 
            width: 280px; 
            flex-shrink: 0;
        }
        .profile-avatar-wrapper { position: relative; width: 140px; height: 140px; margin: 0 auto 25px; }
        .profile-avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; border: 4px solid rgba(255,255,255,0.2); object-fit: cover; background: #e2e8f0; }
        .avatar-edit-icon { position: absolute; bottom: 5px; right: 5px; background: #fff; color: var(--p-blue); width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.3s; }
        .avatar-edit-icon:hover { background: var(--accent); color: white; }
        .profile-main { padding: 40px; background: white; flex-grow: 1; }
        .section-title { font-family: 'Montserrat', sans-serif; color: var(--p-blue); font-size: 1.1rem; font-weight: 700; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
        
        /* Căn chỉnh form cho đều */
        #profile-form { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; grid-column: 1 / -1; }

        .info-group label { display: block; font-size: 0.75rem; font-weight: 700; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }
        .info-group input, .info-group select { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1.5px solid #e2e8f0; background: #f8fafc; font-size: 0.95rem; box-sizing: border-box; }
        .btn-update { margin-top: 30px; padding: 14px 30px; background: var(--p-blue); color: white; border: none; border-radius: 10px; font-family: 'Montserrat', sans-serif; font-weight: 700; cursor: pointer; transition: 0.3s; width: 100%; }
        .btn-update:hover { background: var(--accent); transform: translateY(-2px); } 
        
        /* Tabs Style Vertical (Cột bên trái) */
        .profile-tabs { display: flex; flex-direction: column; gap: 8px; }
        .tab-btn { padding: 14px 20px; border: none; background: transparent; font-family: 'Montserrat', sans-serif; font-weight: 600; color: #64748b; cursor: pointer; border-radius: 12px; transition: 0.2s; font-size: 0.95rem; text-align: left; width: 100%; display: flex; align-items: center; gap: 12px; }
        .tab-btn i { width: 24px; text-align: center; }
        .tab-btn.active { color: white; background: var(--p-blue); box-shadow: 0 4px 12px rgba(26, 35, 126, 0.2); }
        .tab-btn:hover:not(.active) { color: var(--p-blue); background: #f1f5f9; }
        
        .tab-content-profile { display: none; animation: fadeIn 0.3s ease; }
        .tab-content-profile.active { display: block; }
        
        .history-item {min-width: max-content; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; transition: 0.2s; }
        .history-item:hover { transform: translateX(5px); border-color: var(--accent); }
        .history-info h4 { margin: 0 0 5px; color: var(--p-blue); font-size: 1rem; }
        .history-info p { margin: 0; color: #64748b; font-size: 0.85rem; }
        .history-score { font-size: 1.5rem; font-weight: 900; color: var(--accent); text-align: right; }
        .history-score span { font-size: 0.8rem; color: #94a3b8; font-weight: 500; display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 992px) { 
            .profile-card { grid-template-columns: 1fr; }
            .profile-right-panel { flex-direction: column; min-height: unset; }
            .profile-sidebar { width: 100%; }
            
            /* Đưa menu lên trên cùng trên mobile */
            .profile-nav-col { 
                position: sticky; 
                top: 80px;
                z-index: 90;
                padding: 10px;
                width: 100%;
                box-sizing: border-box; 
                order: -1; /* Đảm bảo menu luôn ở trên */
            }

            .profile-tabs { 
                flex-direction: row; 
                overflow-x: auto; 
                white-space: nowrap;
                padding-bottom: 5px; /* Để scrollbar không dính sát */
            }
            .profile-tabs::-webkit-scrollbar { display: none; }
            
            .tab-btn { 
                flex-shrink: 0; 
                width: auto; 
            }

            .profile-main {
                padding-top: 20px;
            }
            
            .profile-wrapper { padding: 100px 15px 40px; }
            .info-grid { grid-template-columns: 1fr; gap: 15px; }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    

    <div class="profile-wrapper">
        <div class="profile-card" data-aos="fade-up">
            <div class="profile-nav-col">
                <div class="profile-tabs">
                    <button class="tab-btn active" onclick="window.openTab('info', this)"><i class="fas fa-user-edit"></i> Thông tin</button>
                    <button class="tab-btn" onclick="window.openTab('history', this)"><i class="fas fa-history"></i> Lịch sử Test</button>
                </div>
            </div>

            <div class="profile-right-panel"> <!-- Khối bao bọc cột phải -->
                <div class="profile-sidebar">
                    <div class="profile-avatar-wrapper">
                        <img id="display-avatar" src="images/avatar-profile.png" alt="User">
                        <div class="avatar-edit-icon" onclick="document.getElementById('avatar-input').click()">
                            <i class="fas fa-camera"></i>
                        </div>
                        <input type="file" id="avatar-input" style="display: none;" accept="image/*">
                    </div>
                    <h3 id="display-name">Học viên</h3>
                    <p id="display-email">đang tải...</p>
                    
                    <div style="margin-top: 30px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);">
                        <small style="text-transform: uppercase; font-size: 0.65rem; letter-spacing: 1px;">Hạng thành viên</small>
                        <div style="font-weight: 800; color: #ffd700; margin-top: 5px; font-size: 1rem;">
                            <i class="fas fa-crown"></i> STANDARD
                        </div>
                    </div>
                </div>
    
                <div class="profile-main">
                    <div class="tab-content-wrapper">
                        <div id="tab-info" class="tab-content-profile active">
                            <div class="section-title">THÔNG TIN CÁ NHÂN</div>
                            <form id="profile-form">
                                <div class="info-grid">
                                    <div class="info-group">
                                        <label>Họ và Tên</label>
                                        <input type="text" id="input-name" placeholder="Tên hiển thị">
                                    </div>
                                    <div class="info-group">
                                        <label>Số điện thoại</label>
                                        <input type="text" id="input-phone" placeholder="Số điện thoại">
                                    </div>
                                    <div class="info-group">
                                        <label>Giới tính</label>
                                        <select id="input-gender">
                                            <option value="">Chọn giới tính</option>
                                            <option value="Nam">Nam</option>
                                            <option value="Nữ">Nữ</option>
                                            <option value="Khác">Khác</option>
                                        </select>
                                    </div>
                                    <div class="info-group">
                                        <label>Email</label>
                                        <input type="email" id="input-email" disabled>
                                    </div>
                                    <div class="info-group">
                                        <label>Ngày sinh</label>
                                        <input type="date" id="input-dob">
                                    </div>
                                </div>
    
                                <div class="section-title" style="margin-top: 30px;">BẢO MẬT</div>
                                <div class="info-group">
                                    <label>Mật khẩu</label>
                                    <div style="position: relative;">
                                        <input type="password" value="********" disabled>
                                        <small id="change-pass-btn" style="color: var(--accent); cursor: pointer; position: absolute; right: 15px; top: 12px; font-weight: 700;">ĐỔI MẬT KHẨU</small>
                                    </div>
                                </div>
    
                                <button type="submit" class="btn-update" id="submit-btn">
                                    <i class="fas fa-check-circle"></i> CẬP NHẬT THÔNG TIN
                                </button>
                            </form>
                        </div>
    
                        <div id="tab-history" class="tab-content-profile">
                            <div class="section-title">KẾT QUẢ KIỂM TRA</div>
                            <div id="history-list-container">
                                <p style="text-align:center; color:#64748b;">Đang tải dữ liệu...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <!-- Custom Popup -->
    <div id="custom-popup" class="popup-overlay">
        <div class="popup-content">
            <span id="popup-icon" class="popup-icon"></span>
            <h3 id="popup-title"></h3>
            <p id="popup-message"></p>
            <button id="popup-close-btn" class="btn-close-popup">Đóng</button>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script type="module">
        import { auth, onAuthStateChanged, updateProfile, sendPasswordResetEmail, db, doc, getDoc, setDoc, collection, query, where, getDocs, orderBy, updateDoc } from './js/firebase-config.js';
        
        window.tempAvatarUrl = null;
        
        // --- TAB LOGIC ---
        window.openTab = function(tabName, btn) {
            document.querySelectorAll('.tab-content-profile').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            if(btn) btn.classList.add('active');
        };

        // --- LOAD HISTORY ---
        async function loadTestHistory(userId) {
            const container = document.getElementById('history-list-container');
            try {
                // Lấy kết quả bài test của user này
                // Bỏ orderBy trong query để tránh lỗi "requires an index" và sort ở client
                const q = query(
                    collection(db, "quiz_results"), 
                    where("userId", "==", userId)
                );
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    container.innerHTML = '<p style="text-align:center; color:#64748b;">Bạn chưa làm bài kiểm tra nào.</p><div style="text-align:center; margin-top:15px;"><a href="ivyenglish-level-test.html" class="btn-update" style="display:inline-block; width:auto; text-decoration:none;">LÀM BÀI TEST NGAY</a></div>';
                    return;
                }

                // Sắp xếp dữ liệu tại Client (Mới nhất lên đầu)
                const historyData = [];
                querySnapshot.forEach(doc => historyData.push(doc.data()));
                
                historyData.sort((a, b) => {
                    const tA = a.timestamp && a.timestamp.seconds ? a.timestamp.seconds : 0;
                    const tB = b.timestamp && b.timestamp.seconds ? b.timestamp.seconds : 0;
                    return tB - tA; 
                });

                let html = '';
                historyData.forEach(data => {
                    html += `
                        <div class="history-item">
                            <div class="history-info">
                                <h4>${data.TrinhDo || 'Chưa xếp hạng'}</h4>
                                <p><i class="far fa-clock"></i> ${data.ThoiGian || '---'}</p>
                            </div>
                            <div class="history-score">
                                ${data.DiemSo || '0/15'}
                                <span>Điểm số</span>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                console.error("Lỗi tải lịch sử:", err);
                container.innerHTML = `<p style="text-align:center; color:red;">Lỗi tải dữ liệu: ${err.message}</p>`;
            }
        }

        // --- POPUP LOGIC ---
        function showPopup(type, title, message) {
            const popup = document.getElementById('custom-popup');
            const iconEl = document.getElementById('popup-icon');
            const titleEl = document.getElementById('popup-title');
            const messageEl = document.getElementById('popup-message');

            if (!popup || !iconEl || !titleEl || !messageEl) return;

            titleEl.innerText = title;
            messageEl.innerHTML = message;

            let iconClass = 'fas fa-info-circle';
            let iconColor = '#3498db';
            if (type === 'success') {
                iconClass = 'fas fa-check-circle';
                iconColor = '#2ECC71';
            } else if (type === 'error') {
                iconClass = 'fas fa-times-circle';
                iconColor = '#e74c3c';
            }
            iconEl.innerHTML = `<i class="${iconClass}"></i>`;
            iconEl.style.color = iconColor;
            
            popup.style.display = 'flex';
        }

        function closePopup() {
            const popup = document.getElementById('custom-popup');
            if (popup) popup.style.display = 'none';
        }
        document.getElementById('popup-close-btn').addEventListener('click', closePopup);
        document.getElementById('custom-popup').addEventListener('click', (e) => { if(e.target.id === 'custom-popup') closePopup(); });
        // --- END POPUP LOGIC ---

        // 1. UPLOAD ẢNH LÊN CLOUDINARY
        document.getElementById('avatar-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const avatarImg = document.getElementById('display-avatar');
            const originalSrc = avatarImg.src;
            avatarImg.style.opacity = "0.4";

            const CLOUDINARY_URL = 'https://api.cloudinary.com/v1_1/dnt6j6wyo/upload';
            const CLOUDINARY_UPLOAD_PRESET = 'ivyenglish_upload';

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

            try {
                const response = await fetch(CLOUDINARY_URL, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (result.secure_url) {
                    window.tempAvatarUrl = result.secure_url;
                    avatarImg.src = window.tempAvatarUrl;
                    showPopup('success', 'Thành công', 'Ảnh đại diện đã được tải lên. Nhấn "Cập nhật" để lưu thay đổi.');
                } else {
                    showPopup('error', 'Lỗi tải ảnh', 'Không thể tải ảnh lên lúc này. Vui lòng thử lại sau.');
                    avatarImg.src = originalSrc;
                }
            } catch (err) {
                showPopup('error', 'Lỗi kết nối', 'Không thể kết nối đến máy chủ lưu trữ.');
                avatarImg.src = originalSrc;
            } finally {
                avatarImg.style.opacity = "1";
            }
        });

        // 2. LOAD DATA
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('display-email').innerText = user.email;
                document.getElementById('input-email').value = user.email;

                try {
                    if (user.photoURL) document.getElementById('display-avatar').src = user.photoURL;
                    
                    // Mặc định lấy tên từ Google nếu có (hiển thị trước khi load Sheet để không bị trống)
                    if(user.displayName) {
                        document.getElementById('display-name').innerText = user.displayName;
                        document.getElementById('input-name').value = user.displayName;
                    }

                    const docRef = doc(db, "users", user.uid);
                    const docSnap = await getDoc(docRef);
                    
                    if (docSnap.exists()) {
                        const row = docSnap.data();
                        if (row["Họ Tên"]) {
                            document.getElementById('display-name').innerText = row["Họ Tên"];
                            document.getElementById('input-name').value = row["Họ Tên"];
                            
                            // Cập nhật luôn tên trên header nếu đang ở trang Profile
                            const headerName = document.getElementById('nav-user-name');
                            if (headerName) headerName.innerText = row["Họ Tên"];
                            localStorage.setItem('ivy_user_name', row["Họ Tên"]); // Lưu tên vào bộ nhớ trình duyệt
                        }
                        document.getElementById('input-phone').value = row["Số Điện Thoại"] || "";
                        document.getElementById('input-dob').value = row["Ngày Sinh"] || "";
                        document.getElementById('input-gender').value = row["Giới Tính"] || "";
                        if (row["Avatar"]) document.getElementById('display-avatar').src = row["Avatar"];
                    }
                } catch (err) { console.error("Lỗi load data:", err); }
                
                // Load lịch sử bài test
                loadTestHistory(user.uid);
            } else {
                window.location.href = 'login.html';
            }
        });

        // 3. SAVE DATA
        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return;

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "ĐANG LƯU...";

            const payload = {
                "ID": user.uid,
                "Họ Tên": document.getElementById('input-name').value.trim(),
                "Email": user.email,
                "Số Điện Thoại": document.getElementById('input-phone').value.trim(),
                "Giới Tính": document.getElementById('input-gender').value,
                "Ngày Sinh": document.getElementById('input-dob').value,
                "Avatar": window.tempAvatarUrl || document.getElementById('display-avatar').src,
                "Thời Gian": new Date().toLocaleString('vi-VN')
            };

            try {
                await setDoc(doc(db, "users", user.uid), payload, { merge: true });

                showPopup('success', 'Thành công', 'Thông tin cá nhân của bạn đã được cập nhật.');
                document.getElementById('display-name').innerText = payload["Họ Tên"];
                
                // Cập nhật tên trên Header ngay lập tức
                const headerName = document.getElementById('nav-user-name');
                if(headerName) headerName.innerText = payload["Họ Tên"];
                localStorage.setItem('ivy_user_name', payload["Họ Tên"]); // Lưu tên mới vào bộ nhớ trình duyệt

                // Cập nhật tên vào Firebase Profile để đồng bộ cho các lần đăng nhập sau
                await updateProfile(user, { displayName: payload["Họ Tên"], photoURL: payload["Avatar"] });

                // Cập nhật Avatar và Tên mới vào các bài đánh giá (Reviews) đã đăng để đồng bộ
                const reviewsRef = collection(db, "reviews");
                const qReviews = query(reviewsRef, where("userId", "==", user.uid));
                const querySnapshot = await getDocs(qReviews);
                const updatePromises = [];
                querySnapshot.forEach((docSnap) => {
                    const p = updateDoc(doc(db, "reviews", docSnap.id), {
                        userName: payload["Họ Tên"],
                        userAvatar: payload["Avatar"]
                    });
                    updatePromises.push(p);
                });
                await Promise.all(updatePromises);
            } catch (err) { 
                showPopup('error', 'Lỗi hệ thống', 'Không thể lưu thông tin. Vui lòng thử lại sau.');
            }
            finally {
                btn.disabled = false;
                btn.innerText = "CẬP NHẬT NGAY";
            }
        });

        // 4. ĐỔI MẬT KHẨU
        document.getElementById('change-pass-btn').addEventListener('click', async () => {
            const user = auth.currentUser;
            if (user && user.email) {
                if (confirm(`Bạn có muốn gửi email đặt lại mật khẩu tới ${user.email} không?`)) {
                    try {
                        await sendPasswordResetEmail(auth, user.email);
                        showPopup('success', 'Đã gửi Email', 'Một email hướng dẫn đã được gửi tới hòm thư của bạn. Vui lòng kiểm tra và làm theo hướng dẫn.');
                    } catch (error) {
                        showPopup('error', 'Lỗi', 'Không thể gửi email đặt lại mật khẩu lúc này. Vui lòng thử lại sau.');
                    }
                }
            }
        });

        async function includeHTML() {
            const comps = [{ id: 'header-placeholder', file: 'header.html' }, { id: 'footer-placeholder', file: 'footer.html' }];
            for (const c of comps) {
                const el = document.getElementById(c.id);
                if (el) {
                    const res = await fetch(c.file);
                    if (res.ok) el.innerHTML = await res.text();
                }
            }
            if (window.AOS) AOS.init({ duration: 800, once: true });
            
            // Sửa lỗi: Kích hoạt logic cho Menu Mobile và nút ScrollTop sau khi tải Header/Footer
            if (window.initMenuLogic) window.initMenuLogic();
            if (window.initScrollToTop) window.initScrollToTop();
        }
        includeHTML();
    </script>
    <script type="module" src="./js/auth-handler.js"></script>
    <script type="module" src="./js/firebase-config.js"></script>
    <script src="js/menu-scrolltop.js"></script>
    <script src="js/daily-word.js"></script>
</body>
</html>
